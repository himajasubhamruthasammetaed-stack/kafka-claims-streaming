# Local Kafka (single-node KRaft, no ZooKeeper) and PostgreSQL.
# The apache/kafka image's default config listens on localhost:9092,
# which is what the Python code on your machine connects to.
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims"]
      interval: 5s
      timeout: 5s
      retries: 10
